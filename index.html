    <!-- ── Resource Hints ────────────────────────────────────
         preconnect for origins needed during first paint (fonts),
         dns-prefetch for origins only reached later (analytics,
         the form endpoint, the download). preconnect holds an
         open TCP+TLS socket, so using it on six origins costs
         more than it saves — dns-prefetch is the cheap version. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Hero background film -->

    <!-- Tag Manager fires within the first second; the DNS lookup
         is the part worth removing from the critical path. -->

    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />

    <!-- Reached only on form submit / profile download -->

    <!-- ═══════════════════════════════════════════════════════
         FLOATING CALL BUTTON — hardcoded in HTML so it works
         on ALL devices (mobile, desktop, iOS, Android) before
         any JS loads. Immune to React, Lenis, stacking contexts,
         overflow:hidden, transforms, and preloader state.
         ═══════════════════════════════════════════════════════ -->
    <style>
      #mc-call-btn {
        position: fixed;
        bottom: 24px;
        right: 20px;
        z-index: 2147483647;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: #22c55e;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        box-shadow: 0 4px 24px rgba(34,197,94,0.55);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        animation: mc-bounce 2.4s ease-in-out infinite;
        will-change: transform;
      }
      #mc-call-btn:active {
        transform: scale(0.9);
      }
      #mc-call-ring {
        position: absolute;
        inset: -5px;
        border-radius: 50%;
        border: 2.5px solid #22c55e;
        animation: mc-pulse 2s ease-out infinite;
        pointer-events: none;
      }
      @keyframes mc-bounce {
        0%, 100% { transform: scale(1); }
        50%       { transform: scale(1.08); }
      }
      @keyframes mc-pulse {
        0%   { transform: scale(1);   opacity: 0.6; }
        100% { transform: scale(1.65); opacity: 0; }
      }
      /* Declared here as well as in index.css: this block is inline
         in the document, so it applies on the very first frame —
         before the stylesheet has been fetched. A button that
         pulses for 400ms and then stops is worse than one that
         never pulses at all. */
      @media (prefers-reduced-motion: reduce) {
        #mc-call-btn  { animation: none !important; }
        #mc-call-ring { animation: none !important; opacity: 0.35; }
      }
      /* The call button is screen furniture, not content. */
      @media print {
        #mc-call-btn { display: none !important; }
      }
    </style>
